<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1080" height="1080"></canvas>
<script>
'use strict';
/* Motor de lyric edits: todo es f(t). render.js llama a window.setup(cfg) y luego a window.frame(t). */
const C = document.getElementById('c'), X = C.getContext('2d');
const S = 1080;
const L = document.createElement('canvas'); L.width = L.height = S; const LX = L.getContext('2d');   // capa de texto (acumulada)
const T = document.createElement('canvas'); T.width = T.height = S; const TX = T.getContext('2d');   // una sub-muestra
let CFG = null, SEGS = [], frameCache = new Map();

const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const eOut = k => 1 - Math.pow(1 - k, 3);
const eExpo = k => k >= 1 ? 1 : 1 - Math.pow(2, -10 * k);
const eBack = k => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };
const hash = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const seg = new Intl.Segmenter('es', { granularity: 'grapheme' });
const graphemes = s => Array.from(seg.segment(s), g => g.segment);
const isEmoji = g => /\p{Extended_Pictographic}/u.test(g);


window.setup = async (cfg) => {
  CFG = cfg;
  const fonts = new Set(cfg.cuts.map(c => c.font));
  for (const f of fonts) { if (cfg.fontFiles[f]) { const ff = new FontFace(f, `url(${cfg.fontFiles[f]})`); await ff.load(); document.fonts.add(ff); } }
  await document.fonts.load('80px "Noto Color Emoji"', '😈');
  for (const [g, file] of Object.entries(cfg.emoji || {})) { const im = new Image(); im.src = cfg.emojiDir + '/' + file; await im.decode(); EMO.set(g, im); }
  const cs = cfg.cuts;
  SEGS = cs.map((c, i) => {
    const t1 = i + 1 < cs.length ? cs[i + 1].t : Math.min(cfg.dur, c.t + cfg.lastHold);
    return { i, t0: c.t, t1, text: c.text, font: c.font, color: (cfg.colors || {})[i], bg: (cfg.bg && cfg.bg[i]) || "black" };
  });
  return SEGS.length;
};

/* ---------- video de fondo ---------- */
function vframe(t) {
  const n = clamp(Math.round(t * CFG.fps) + 1, 1, CFG.nFrames);
  if (frameCache.has(n)) return frameCache.get(n);
  const im = new Image(); im.src = CFG.framesDir + '/f' + String(n).padStart(4, '0') + '.jpg';
  const p = im.decode().then(() => im);
  frameCache.set(n, p); if (frameCache.size > 12) frameCache.delete(frameCache.keys().next().value);
  return p;
}

/* ---------- texto ---------- */
/* emojis estilo iPhone como imágenes */
const EMO = new Map();
const EM = 1.12;
const isEmo = g => EMO.has(g);
function runs(text) { const out = []; for (const g of graphemes(text)) { if (isEmo(g)) out.push({ e: g }); else if (out.length && out[out.length - 1].t !== undefined) out[out.length - 1].t += g; else out.push({ t: g }); } return out; }
function gW(ctx, g, size) { return isEmo(g) ? size * EM : ctx.measureText(g).width; }
function richW(ctx, text, size) { return runs(text).reduce((a, r) => a + (r.e ? size * EM : ctx.measureText(r.t).width), 0); }
function drawEmo(ctx, g, x, y, size) { const im = EMO.get(g), d = size * EM * 0.92; ctx.drawImage(im, x - d / 2, y - d / 2 - size * 0.04, d, d); }
function drawRich(ctx, text, y, size) {
  const rs = runs(text), w = richW(ctx, text, size); let x = -w / 2;
  ctx.textAlign = 'left';
  for (const r of rs) { if (r.e) { drawEmo(ctx, r.e, x + size * EM / 2, y, size); x += size * EM; } else { ctx.fillText(r.t, x, y); x += ctx.measureText(r.t).width; } }
  ctx.textAlign = 'center';
}
function fitSize(ctx, font, lines, maxW, maxPx) {
  let s = maxPx;
  for (; s > 40; s -= 4) { ctx.font = `${s}px "${font}", "Noto Color Emoji"`; if (Math.max(...lines.map(l => richW(ctx, l, s))) <= maxW) break; }
  return s;
}
function splitLines(text) {
  const g = graphemes(text).length;
  if (g <= 15) return [text];
  const w = text.split(' '); let best = [text], bd = 1e9;
  for (let i = 1; i < w.length; i++) { const a = w.slice(0, i).join(' '), b = w.slice(i).join(' '); const d = Math.abs(a.length - b.length); if (d < bd) { bd = d; best = [a, b]; } }
  return best;
}
function fillFor(ctx, s, size, w) {
  if (!s.color) { const g = ctx.createLinearGradient(0, -size * 0.6, 0, size * 0.5); g.addColorStop(0, '#ffffff'); g.addColorStop(1, '#ece8ff'); return g; }
  const g = ctx.createLinearGradient(-w / 2, 0, w / 2, 0); g.addColorStop(0, s.color[0]); g.addColorStop(1, s.color[1]); return g;
}
/* dibuja texto plano centrado, con líneas */
function drawLines(ctx, s, lines, size) {
  ctx.font = `${size}px "${s.font}", "Noto Color Emoji"`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const lh = size * 1.08, w = Math.max(...lines.map(l => richW(ctx, l, size)));
  ctx.fillStyle = fillFor(ctx, s, size, w);
  lines.forEach((l, k) => drawRich(ctx, l, (k - (lines.length - 1) / 2) * lh, size));
}
/* texto letra por letra con una función de posición por letra */
function drawGlyphs(ctx, s, text, size, place) {
  ctx.font = `${size}px "${s.font}", "Noto Color Emoji"`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const gs = graphemes(text), ws = gs.map(g => gW(ctx, g, size)), tot = ws.reduce((a, b) => a + b, 0);
  ctx.fillStyle = fillFor(ctx, s, size, tot);
  let x = -tot / 2;
  gs.forEach((g, k) => { const cx = x + ws[k] / 2; x += ws[k]; if (g === ' ') return; ctx.save(); place(ctx, k, gs.length, cx, tot); if (isEmo(g)) drawEmo(ctx, g, 0, 0, size); else ctx.fillText(g, 0, 0); ctx.restore(); });
  return tot;
}

/* ---------- movimiento estilo edit: cada tramo tiene una "cámara" que nunca se queda quieta ---------- */
const ENTRIES = ['whip', 'slide', 'flip', 'zoomIn', 'drop', 'bendIn'];
const EXITS = ['whip', 'zoomOut', 'flip', 'slide', 'bendOut', 'spinOut'];
const POS = [[0.5, 0.42], [0.5, 0.5], [0.42, 0.36], [0.58, 0.6], [0.5, 0.3], [0.45, 0.55], [0.56, 0.44], [0.5, 0.66]];
const rnd = (s, k) => hash(s.i * 13.37 + k * 7.1);
const sgn = (s, k) => rnd(s, k) < 0.5 ? -1 : 1;
const sm = k => k * k * (3 - 2 * k);
function plan(s) {
  if (s.plan) return s.plan;
  const p = {};
  p.pos = POS[s.i % POS.length];
  p.entry = ENTRIES[(s.i * 5 + 1) % ENTRIES.length];
  p.exit = EXITS[(s.i * 7 + 3) % EXITS.length];
  // deriva continua (de -> a) durante todo el tramo
  p.dx = sgn(s, 1) * (70 + 90 * rnd(s, 2)); p.dy = sgn(s, 3) * (30 + 60 * rnd(s, 4));
  p.r0 = sgn(s, 5) * (0.06 + 0.22 * rnd(s, 6)); p.r1 = p.r0 - sgn(s, 5) * (0.2 + 0.25 * rnd(s, 7));
  p.yaw0 = sgn(s, 8) * (0.25 + 0.35 * rnd(s, 9)); p.yaw1 = -p.yaw0 * (0.4 + 0.6 * rnd(s, 10));
  p.pitch = (rnd(s, 11) - 0.5) * 0.5;
  p.k0 = (rnd(s, 12) < 0.55 ? sgn(s, 13) * (0.0006 + 0.0012 * rnd(s, 14)) : 0); p.k1 = p.k0 * (0.4 + rnd(s, 15));
  p.wave = rnd(s, 16) < 0.3 ? 18 + 20 * rnd(s, 17) : 0;
  p.sc0 = 0.84 + 0.08 * rnd(s, 18); p.sc1 = p.sc0 + 0.16 + 0.1 * rnd(s, 19);
  p.side = sgn(s, 20);
  return (s.plan = p);
}
/* estado del bloque en un instante: devuelve transformaciones */
function stateAt(s, lt, dur) {
  const p = plan(s);
  const ein = Math.min(0.2, dur * 0.35), eout = Math.min(0.16, dur * 0.3);
  const u = sm(clamp(lt / dur));
  const st = {
    x: S * p.pos[0] + lerp(-p.dx / 2, p.dx / 2, u), y: S * p.pos[1] + lerp(-p.dy / 2, p.dy / 2, u),
    rot: lerp(p.r0, p.r1, u), yaw: lerp(p.yaw0, p.yaw1, u), pitch: p.pitch * (1 - u),
    sc: lerp(p.sc0, p.sc1, u), k: lerp(p.k0, p.k1, u), wave: p.wave, wph: lt * 5, alpha: 1,
  };
  const ki = clamp(lt / ein), a = 1 - eExpo(ki);          // a: 1 al empezar -> 0
  if (a > 0.0005) switch (p.entry) {
    case 'whip': st.rot += p.side * 1.9 * a; st.sc *= 1 + 0.6 * a; st.x += p.side * 120 * a; break;
    case 'slide': st.x += p.side * S * 0.9 * a; st.yaw += p.side * 0.6 * a; break;
    case 'flip': st.yaw += p.side * 1.45 * a; break;
    case 'zoomIn': st.sc *= lerp(1, 0.08, a); st.rot += p.side * 0.5 * a; break;
    case 'drop': st.y -= S * 0.7 * a; st.rot += p.side * 0.6 * a; break;
    case 'bendIn': st.k += p.side * 0.006 * a; st.rot -= p.side * 1.2 * a; st.sc *= 1 + 0.4 * a; break;
  }
  const ko = clamp((lt - (dur - eout)) / eout), b = ko * ko * ko;  // b: 0 -> 1 al final, acelerando
  if (b > 0.0005) switch (p.exit) {
    case 'whip': st.rot -= p.side * 2.2 * b; st.x -= p.side * 200 * b; st.sc *= 1 + 0.5 * b; break;
    case 'zoomOut': st.sc *= 1 + 4 * b; st.alpha = 1 - b * 0.9; break;
    case 'flip': st.yaw -= p.side * 1.5 * b; break;
    case 'slide': st.x -= p.side * S * 1.0 * b; st.yaw -= p.side * 0.5 * b; break;
    case 'bendOut': st.k -= p.side * 0.007 * b; st.rot += p.side * 1.4 * b; st.y -= 160 * b; break;
    case 'spinOut': st.rot += p.side * 3.2 * b; st.sc *= 1 - 0.85 * b; break;
  }
  return st;
}
const layoutCache = new Map();
function layout(ctx, s) {
  if (layoutCache.has(s.i)) return layoutCache.get(s.i);
  const lines = splitLines(s.text);
  const size = fitSize(ctx, s.font, lines, S * (lines.length > 1 ? 0.5 : 0.56), lines.length > 1 ? 84 : 96);
  ctx.font = `${size}px "${s.font}", "Noto Color Emoji"`;
  const lh = size * 1.06, gl = [];
  let maxw = 0;
  lines.forEach((ln, li) => {
    const gs = graphemes(ln), ws = gs.map(g => gW(ctx, g, size)), w = ws.reduce((a, b) => a + b, 0); maxw = Math.max(maxw, w);
    let x = -w / 2; const y = (li - (lines.length - 1) / 2) * lh;
    gs.forEach((g, k) => { if (g !== ' ') gl.push({ g, x: x + ws[k] / 2, y }); x += ws[k]; });
  });
  const L0 = { size, gl, w: maxw };
  layoutCache.set(s.i, L0); return L0;
}
/* una sub-muestra del texto del tramo s en el tiempo absoluto t */
function drawSeg(ctx, s, t) {
  const lt = t - s.t0, dur = s.t1 - s.t0;
  if (lt < 0 || lt > dur) return;
  const Lo = layout(ctx, s), st = stateAt(s, lt, dur), D = 900;
  ctx.save();
  ctx.font = `${Lo.size}px "${s.font}", "Noto Color Emoji"`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = fillFor(ctx, s, Lo.size, Lo.w);
  ctx.globalAlpha = st.alpha;
  const cy = Math.cos(st.yaw), sy = Math.sin(st.yaw), cp = Math.cos(st.pitch), sp = Math.sin(st.pitch);
  const cr = Math.cos(st.rot), sr = Math.sin(st.rot);
  for (const q of Lo.gl) {
    // curva (arco) + onda
    let x = q.x, y = q.y, ang = 0;
    if (Math.abs(st.k) > 1e-6) { const th = x * st.k, R = 1 / st.k; const yy = y; x = Math.sin(th) * (R - yy); y = R - Math.cos(th) * (R - yy); ang = th; }
    if (st.wave) { const ph = q.x * 0.012 + st.wph; y += Math.sin(ph) * st.wave; ang += Math.atan(Math.cos(ph) * st.wave * 0.012); }
    // 3D: giro en Y (yaw) y X (pitch) con perspectiva
    const X3 = x * cy, Z1 = x * sy, Y3 = y * cp, Z = Z1 + y * sp;
    const f = D / (D + Z * st.sc); if (f <= 0.05) continue;
    const px = X3 * f * st.sc, py = Y3 * f * st.sc;
    // rotación y posición del bloque
    const sx = st.x + px * cr - py * sr, syy = st.y + px * sr + py * cr;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.translate(sx, syy); ctx.rotate(st.rot + ang); ctx.scale(st.sc * f * Math.max(0.04, Math.abs(cy)), st.sc * f * Math.max(0.2, Math.abs(cp)));
    if (isEmo(q.g)) drawEmo(ctx, q.g, 0, 0, Lo.size); else ctx.fillText(q.g, 0, 0);
  }
  ctx.restore();
}
/* cuántas sub-muestras pide este instante (más en los latigazos) */
function needK(t) {
  for (const s of SEGS) { const lt = t - s.t0, dur = s.t1 - s.t0; if (lt < -0.05 || lt > dur + 0.05) continue;
    const ein = Math.min(0.2, dur * 0.35), eout = Math.min(0.16, dur * 0.3);
    if (lt < ein + 0.04 || lt > dur - eout - 0.04) return 24; }
  return 6;
}

/* ---------- fondo ---------- */
async function drawBg(t) {
  const segNow = SEGS.find(s => t >= s.t0 && t < s.t1);
  const first = SEGS[0].t0, last = SEGS[SEGS.length - 1].t1;
  const intro = t < first, outro = t >= last;
  let mode = intro || outro ? 'full' : (segNow ? segNow.bg : 'black');
  X.fillStyle = '#000'; X.fillRect(0, 0, S, S);
  if (mode === 'black') return mode;
  const im = await vframe(t);
  X.save();
  let z = 1.06;
  if (intro) z = lerp(1.0, 1.1, t / first) + Math.pow(clamp((t - (first - 0.25)) / 0.25), 3) * 1.6;
  else if (outro) z = lerp(1.02, 1.12, clamp((t - last) / (CFG.dur - last)));
  else z = 1.08 + 0.04 * clamp((t - segNow.t0) / 2);
  X.translate(S / 2, S / 2); X.scale(z, z); X.translate(-S / 2, -S / 2);
  if (mode === 'video') X.filter = 'grayscale(0.85) brightness(0.42) contrast(1.15)';
  else if (intro) X.filter = 'saturate(1.1) contrast(1.05) brightness(0.92)';
  else X.filter = 'saturate(1.05) contrast(1.05)';
  X.drawImage(im, 0, 0, S, S);
  // zoom blur al final de la intro
  if (intro && t > first - 0.25) { X.globalAlpha = 0.35; for (let k = 1; k <= 4; k++) { const zz = 1 + k * 0.06; X.save(); X.translate(S / 2, S / 2); X.scale(zz, zz); X.translate(-S / 2, -S / 2); X.drawImage(im, 0, 0, S, S); X.restore(); } }
  X.restore(); X.filter = 'none'; X.globalAlpha = 1;
  if (mode === 'video') { X.fillStyle = 'rgba(70,55,140,0.16)'; X.fillRect(0, 0, S, S); }
  return mode;
}

function vignette(a) {
  const g = X.createRadialGradient(S / 2, S / 2, S * 0.3, S / 2, S / 2, S * 0.75);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, `rgba(0,0,0,${a})`);
  X.fillStyle = g; X.fillRect(0, 0, S, S);
}
function flare(t, t0, scale = 1) {
  const k = (t - t0) / 0.7; if (k < 0 || k > 1) return;
  const a = Math.sin(Math.PI * Math.min(1, k * 1.6)) * (1 - k * 0.5);
  X.save(); X.translate(S / 2, S / 2); X.globalCompositeOperation = 'lighter';
  const r = S * 0.55 * scale * (0.6 + 0.6 * k);
  for (let i = 0; i < 14; i++) {
    const ang = i / 14 * Math.PI * 2 + k * 0.4, len = r * (0.55 + 0.45 * hash(i + 3));
    const g = X.createLinearGradient(0, 0, Math.cos(ang) * len, Math.sin(ang) * len);
    g.addColorStop(0, `rgba(255,255,255,${0.75 * a})`); g.addColorStop(1, 'rgba(255,255,255,0)');
    X.strokeStyle = g; X.lineWidth = 2 + 4 * hash(i); X.beginPath(); X.moveTo(0, 0); X.lineTo(Math.cos(ang) * len, Math.sin(ang) * len); X.stroke();
  }
  const rg = X.createRadialGradient(0, 0, 0, 0, 0, r * 0.35); rg.addColorStop(0, `rgba(255,255,255,${0.9 * a})`); rg.addColorStop(1, 'rgba(255,255,255,0)');
  X.fillStyle = rg; X.beginPath(); X.arc(0, 0, r * 0.35, 0, 7); X.fill();
  X.restore();
}

window.frame = async (t) => {
  const mode = await drawBg(t);
  // texto con motion blur por sub-muestras (obturador de medio cuadro)
  LX.clearRect(0, 0, S, S);
  const K = needK(t), sh = 0.9 / CFG.fps;
  const act = SEGS.filter(s => t + sh >= s.t0 && t - sh <= s.t1);
  if (act.length) {
    LX.globalCompositeOperation = 'lighter';
    for (let k = 0; k < K; k++) {
      const tt = t - sh / 2 + sh * (k + 0.5) / K;
      TX.clearRect(0, 0, S, S); TX.globalAlpha = 1;
      for (const s of act) drawSeg(TX, s, tt);
      LX.globalAlpha = 1 / K; LX.drawImage(T, 0, 0);
    }
    LX.globalCompositeOperation = 'source-over'; LX.globalAlpha = 1;
    X.save();
    X.shadowColor = mode === 'black' ? 'rgba(255,255,255,0.28)' : 'rgba(0,0,0,0.75)'; X.shadowBlur = mode === 'black' ? 14 : 22;
    X.drawImage(L, 0, 0);
    X.restore();
  }
  vignette(mode === 'full' ? 0.45 : 0.6);
  // flashes en cortes de bloque y en el golpe de entrada
  const first = SEGS[0].t0;
  let fl = 0;
  if (t >= first && t < first + 0.18) fl = 0.9 * (1 - (t - first) / 0.18);
  for (const s of SEGS) if (s.i > 0 && s.bg !== SEGS[s.i - 1].bg && t >= s.t0 && t < s.t0 + 0.12) fl = Math.max(fl, 0.5 * (1 - (t - s.t0) / 0.12));
  const last = SEGS[SEGS.length - 1].t1;
  if (t >= last && t < last + 0.2) fl = Math.max(fl, 0.8 * (1 - (t - last) / 0.2));
  if (fl > 0) { X.fillStyle = `rgba(255,255,255,${fl})`; X.fillRect(0, 0, S, S); }
  flare(t, last - 0.35, 1.1);
  // fundido final
  const fo = clamp((t - (CFG.dur - 0.9)) / 0.8); if (fo > 0) { X.fillStyle = `rgba(0,0,0,${fo})`; X.fillRect(0, 0, S, S); }
  // grano
  return true;
};
</script>
</body></html>
