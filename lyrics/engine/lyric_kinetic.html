<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1080" height="1080"></canvas>
<script>
'use strict';
/* Tipografía cinética fluida (estilo Apple).
   - Las palabras aparecen una a una (varios estilos), la cámara se desliza siguiendo la frase.
   - Cada cambio de línea es un movimiento encadenado: la línea vieja sale con el mismo movimiento con el que entra la nueva.
   - Escenas "grandes": una sola palabra enorme sobre el video.
   Todo es f(t): render.js llama a window.setup(cfg) y luego a window.frame(t). */
const S = 1080;
const C = document.getElementById('c'), X = C.getContext('2d');
let CFG = null, SEGS = [], LINES = [], frameCache = new Map();

const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const sm = k => k * k * (3 - 2 * k);
const eIn = k => k * k * k;
const eOut = k => 1 - Math.pow(1 - k, 3);
const eOutQ = k => 1 - Math.pow(1 - k, 5);
const eBack = k => { const c1 = 1.5, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };
const hash = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const segm = new Intl.Segmenter('es', { granularity: 'grapheme' });
const graphemes = s => Array.from(segm.segment(s), g => g.segment);
const mixHex = (a, b, k) => { const p = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)); const A = p(a), B = p(b); return `rgb(${A.map((v, i) => Math.round(lerp(v, B[i], k))).join(',')})`; };
const EMO = new Map();

/* paso amortiguado críticamente: la cámara nunca da tirones */
function damp(keys, t, tau) {
  let v = keys[0].v;
  for (let i = 1; i < keys.length; i++) {
    const k = keys[i]; if (t <= k.t) break;
    const u = (t - k.t) / tau;
    v += (k.v - keys[i - 1].v) * (1 - (1 + u) * Math.exp(-u));
  }
  return v;
}

/* ---------- transiciones entre líneas ----------
   p < 0: entrando (de -1 a 0). p > 0: saliendo (de 0 a 1). El mismo tipo para la que sale y la que entra. */
const TRANS = ['up', 'left', 'through', 'flip', 'down', 'spin', 'right', 'sink', 'up', 'through', 'left', 'flip', 'down', 'sink', 'right', 'spin'];
function tr(type, p) {
  const a = Math.abs(p), o = { dx: 0, dy: 0, sc: 1, rot: 0, blur: 0, al: 1 - a, sy: 1 };
  switch (type) {
    case 'up': o.dy = -p * S * 0.42; o.blur = 16 * a; break;
    case 'down': o.dy = p * S * 0.42; o.blur = 16 * a; break;
    case 'left': o.dx = -p * S * 0.6; o.blur = 18 * a; break;
    case 'right': o.dx = p * S * 0.6; o.blur = 18 * a; break;
    case 'sink': o.sc = p > 0 ? 1 - 0.42 * p : 1 + 0.4 * a; o.blur = 18 * a; break;
    case 'through': o.sc = p > 0 ? 1 + 1.8 * p : 1 - 0.6 * a; o.blur = 20 * a; o.al = p > 0 ? 1 - clamp(p * 1.5) : 1 - a; break;
    case 'spin': o.rot = p * 0.5; o.sc = 1 - 0.28 * a; o.blur = 14 * a; break;
    case 'flip': o.sy = Math.cos(p * Math.PI / 2); o.dy = p * 50; o.blur = 10 * a; break;
    case 'slam': o.sc = 1 + 0.9 * a; o.blur = 24 * a; break;
  }
  return o;
}
const REVEALS = ['rise', 'zoom', 'slide', 'letters', 'pop', 'drop', 'wipe'];

window.setup = async (cfg) => {
  CFG = cfg;
  for (const f of new Set(cfg.cuts.map(c => c.font))) if (cfg.fontFiles[f]) { const ff = new FontFace(f, `url(${cfg.fontFiles[f]})`); await ff.load(); document.fonts.add(ff); }
  for (const [g, file] of Object.entries(cfg.emoji || {})) { const im = new Image(); im.src = cfg.emojiDir + '/' + file; await im.decode(); EMO.set(g, im); }
  const cs = cfg.cuts, BASE = cfg.size || 112, big = new Set(cfg.big || []);
  SEGS = cs.map((c, i) => ({ i, t0: c.t, t1: i + 1 < cs.length ? cs[i + 1].t : Math.min(cfg.dur, c.t + cfg.lastHold), text: c.text, font: c.font, color: (cfg.colors || {})[i], bg: big.has(i) ? 'video' : ((cfg.bg && cfg.bg[i]) || 'black'), big: big.has(i) }));
  // líneas: tramos que van juntos; las escenas grandes van solas
  const maxChars = cfg.lineChars || 22;
  let cur = null;
  SEGS.forEach(s => {
    const len = graphemes(s.text).length;
    if (!cur || s.big || cur.big || cur.chars + len > maxChars || cur.segs.length >= 3) { cur = { segs: [], chars: 0, idx: LINES.length, big: s.big }; LINES.push(cur); }
    cur.segs.push(s); cur.chars += len + 1; s.line = cur;
  });
  LINES.forEach((L, li) => {
    L.size = L.big ? BASE * 2.1 : BASE;
    const font = s => `${L.size}px "${s.font}", "Noto Color Emoji"`, GAP = L.size * 0.3;
    let x = 0; L.toks = [];
    L.segs.forEach(s => {
      const toks = [];
      s.text.split(/\s+/).filter(Boolean).forEach(w => {
        const gs = graphemes(w), txt = gs.filter(g => !EMO.has(g)).join('');
        if (txt) toks.push({ w: txt });
        gs.filter(g => EMO.has(g)).forEach(e => toks.push({ w: e, emo: true }));
      });
      const dur = s.t1 - s.t0, n = toks.length, step = L.big ? 0.05 : Math.min(0.15, dur * 0.55 / Math.max(1, n));
      toks.forEach((tk, k) => {
        X.font = font(s);
        tk.wd = tk.emo ? L.size * 1.05 : X.measureText(tk.w).width;
        if (!tk.emo) { tk.cw = graphemes(tk.w).map(g => X.measureText(g).width); }
        tk.x = x; x += tk.wd + GAP; tk.s = s;
        tk.tr = s.t0 + k * step + (tk.emo ? 0.05 : 0);
        L.toks.push(tk);
      });
    });
    L.w = x - GAP; L.t0 = L.segs[0].t0; L.t1 = L.segs[L.segs.length - 1].t1;
    L.reveal = REVEALS[li % REVEALS.length];
    L.ph = hash(li + 1) * 6.28; L.tilt = (hash(li + 7) - 0.5) * 0.06;
    // cámara de la línea: centra lo que ya apareció y se aleja si no cabe
    const fit = r => clamp(S * (L.big ? 0.86 : 0.84) / Math.max(1, r), L.big ? 0.35 : 0.55, 1.0);
    L.camX = [{ t: -1e9, v: (L.toks[0].x + L.toks[0].wd) / 2 }]; L.camZ = [{ t: -1e9, v: fit(L.toks[0].x + L.toks[0].wd) }];
    if (L.big) { L.camX = [{ t: -1e9, v: L.w / 2 }]; L.camZ = [{ t: -1e9, v: fit(L.w) }]; }
    else L.toks.forEach((tk, k) => { if (k === 0) return; const r = tk.x + tk.wd; L.camX.push({ t: tk.tr, v: r / 2 }); L.camZ.push({ t: tk.tr, v: fit(r) }); });
  });
  LINES.forEach((L, li) => {
    const nx = LINES[li + 1];
    L.tin = L.big ? 'slam' : (li === 0 ? 'sink' : TRANS[(li - 1) % TRANS.length]);
    L.tEnd = nx ? nx.t0 : L.t1;
    L.tout = nx ? (nx.big ? 'through' : TRANS[li % TRANS.length]) : 'through';
  });
  return SEGS.length;
};

/* ---------- fondo ---------- */
function vframe(t) {
  const n = clamp(Math.round(t * CFG.fps) + 1, 1, CFG.nFrames);
  if (frameCache.has(n)) return frameCache.get(n);
  const im = new Image(); im.src = CFG.framesDir + '/f' + String(n).padStart(5, '0') + '.jpg';
  const p = im.decode().then(() => im);
  frameCache.set(n, p); if (frameCache.size > 12) frameCache.delete(frameCache.keys().next().value);
  return p;
}
async function drawBg(t) {
  const first = SEGS[0].t0, last = SEGS[SEGS.length - 1].t1;
  const intro = t < first, outro = t >= last;
  X.setTransform(1, 0, 0, 1, 0, 0); X.filter = 'none'; X.globalAlpha = 1; X.fillStyle = '#000'; X.fillRect(0, 0, S, S);
  let a = 0;
  for (const s of SEGS) if (s.bg === 'video') { const fin = clamp((t - (s.t0 - 0.12)) / 0.24), fout = 1 - clamp((t - (s.t1 - 0.12)) / 0.24); a = Math.max(a, Math.min(fin, fout)); }
  const full = intro ? 1 : outro ? clamp((t - last + 0.1) / 0.5) : 0;
  if (a <= 0 && full <= 0) return;
  const im = await vframe(t);
  const L = LINES.find(L => t >= L.t0 && t < L.tEnd);
  const push = L ? 1.1 + 0.08 * sm(clamp((t - L.t0) / Math.max(0.3, L.tEnd - L.t0))) : 1.1;
  const z = intro ? lerp(1.0, 1.12, t / first) : push;
  X.save(); X.translate(S / 2, S / 2); X.scale(z, z); X.translate(-S / 2, -S / 2);
  if (a > 0) { X.globalAlpha = a; X.filter = L && L.big ? 'grayscale(0.85) brightness(0.42) contrast(1.15)' : 'grayscale(0.9) brightness(0.32) contrast(1.15) blur(3px)'; X.drawImage(im, 0, 0, S, S); }
  if (full > 0) {
    const k = intro ? clamp((t - (first - 0.6)) / 0.6) : 0;
    X.globalAlpha = full * (1 - eOut(k));
    X.filter = `saturate(1.1) contrast(1.05) blur(${(eOut(k) * 18).toFixed(1)}px)`;
    X.drawImage(im, 0, 0, S, S);
  }
  X.restore(); X.filter = 'none'; X.globalAlpha = 1;
}

/* ---------- texto ---------- */
function lineXf(L, t) {
  // entrada
  const kin = clamp((t - (L.t0 - 0.04)) / (L.big ? 0.32 : 0.44));
  const pin = -(1 - eOutQ(kin));
  // salida: empieza un poco antes del corte y termina rápido (no quedan letras fantasma)
  const kout = clamp((t - (L.tEnd - 0.12)) / 0.32);
  const pout = eIn(kout);
  const o = pout > 0 ? tr(L.tout, pout) : tr(L.tin, pin);
  if (kin < 1 && pout > 0) { const i2 = tr(L.tin, pin); o.al *= i2.al; o.blur += i2.blur; }
  return o;
}
function drawWord(L, tk, t, mode) {
  const s = tk.s, k = (t - tk.tr) / (L.big ? 0.3 : 0.42);
  if (k < 0) return;
  const e = eOutQ(clamp(k));
  let dx = 0, dy = 0, sc = 1, blur = 0, al = clamp(k * 2.5), wipe = 1;
  if (L.big) { sc = lerp(1.25, 1, e); blur = 10 * (1 - e); }
  else switch (L.reveal) {
    case 'rise': dy = 32 * (1 - e); blur = 12 * (1 - e); sc = lerp(1.1, 1, e); break;
    case 'zoom': sc = lerp(2.1, 1, e); blur = 18 * (1 - e); al = clamp(k * 3); break;
    case 'slide': dx = 90 * (1 - e); blur = 12 * (1 - e); break;
    case 'pop': sc = Math.max(0.01, lerp(0.3, 1, eBack(clamp(k * 1.25)))); blur = 6 * (1 - e); break;
    case 'drop': dy = -70 * (1 - eBack(clamp(k * 1.2))); blur = 8 * (1 - e); break;
    case 'wipe': wipe = e; dx = 18 * (1 - e); al = 1; break;
    case 'letters': break;
  }
  if (tk.emo) { sc = Math.max(0.01, eBack(clamp(k * 1.4))); blur = 0; dx = dy = 0; wipe = 1; al = clamp(k * 3); }
  if (al <= 0.003) return;
  X.save();
  X.translate(tk.x + tk.wd / 2 + dx, dy);
  X.scale(sc, sc);
  X.globalAlpha *= al;
  const totalBlur = X._lineBlur + blur;
  if (totalBlur > 0.4) X.filter = `blur(${totalBlur.toFixed(1)}px)`;
  if (tk.emo) { const im = EMO.get(tk.w), d = tk.wd * 0.95; X.drawImage(im, -d / 2, -d / 2 - L.size * 0.04, d, d); X.restore(); return; }
  X.font = `${L.size}px "${s.font}", "Noto Color Emoji"`;
  const acc = s.color ? s.color[0] : (CFG.accent || '#8fd3ff');
  X.fillStyle = s.color ? mixHex(s.color[0], s.color[1], 0.3) : mixHex(acc, '#ffffff', eOut(clamp((t - tk.tr - 0.18) / 0.5)));
  if (mode !== 'black') { X.shadowColor = 'rgba(0,0,0,0.65)'; X.shadowBlur = L.big ? 34 : 18; }
  if (L.reveal === 'letters' && !L.big) {
    // letra por letra
    let x = -tk.wd / 2; const gs = graphemes(tk.w);
    gs.forEach((g, j) => {
      const kk = clamp((t - tk.tr - j * 0.028) / 0.3), ee = eOutQ(kk);
      if (kk > 0) { X.save(); X.globalAlpha *= clamp(kk * 3); X.translate(x + tk.cw[j] / 2, 30 * (1 - ee)); X.rotate(0.5 * (1 - ee)); X.fillText(g, -tk.cw[j] / 2, 0); X.restore(); }
      x += tk.cw[j];
    });
  } else {
    if (wipe < 1) { X.beginPath(); X.rect(-tk.wd / 2 - 10, -L.size, (tk.wd + 20) * wipe, L.size * 2); X.clip(); }
    X.fillText(tk.w, -tk.wd / 2, 0);
  }
  X.restore();
}
function bgMode(t) { const s = SEGS.find(s => t >= s.t0 && t < s.t1); return (t < SEGS[0].t0 || !s) ? 'full' : s.bg; }
function drawText(t) {
  const mode = bgMode(t);
  for (const L of LINES) {
    if (t < L.t0 - 0.05 || t > L.tEnd + 0.25) continue;
    const o = lineXf(L, t); if (o.al <= 0.003) continue;
    const camX = damp(L.camX, t, 0.11), camZ = damp(L.camZ, t, 0.16);
    const u = clamp((t - L.t0) / Math.max(0.3, L.tEnd - L.t0));
    const push = 1 + (L.big ? 0.12 : 0.07) * sm(u);
    const flo = Math.sin(t * 1.1 + L.ph) * 8, rot = L.tilt + Math.sin(t * 0.6 + L.ph) * 0.02 + (L.big ? (u - 0.5) * 0.06 : 0);
    X.save();
    X.setTransform(1, 0, 0, 1, 0, 0);
    X.translate(S / 2 + o.dx, S / 2 + o.dy + flo);
    X.rotate(rot + o.rot);
    X.scale(camZ * push * o.sc, camZ * push * o.sc * o.sy);
    X.translate(-camX, 0);
    X.textBaseline = 'middle'; X.textAlign = 'left';
    X.globalAlpha = o.al; X._lineBlur = o.blur;
    for (const tk of L.toks) drawWord(L, tk, t, mode);
    X.restore();
  }
}
function vignette(a) {
  const g = X.createRadialGradient(S / 2, S / 2, S * 0.3, S / 2, S / 2, S * 0.76);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, `rgba(0,0,0,${a})`);
  X.fillStyle = g; X.fillRect(0, 0, S, S);
}
window.frame = async (t) => {
  await drawBg(t);
  drawText(t);
  X.setTransform(1, 0, 0, 1, 0, 0); X.globalAlpha = 1; X.filter = 'none';
  vignette(0.55);
  const fo = clamp((t - (CFG.dur - 0.9)) / 0.8); if (fo > 0) { X.fillStyle = `rgba(0,0,0,${fo})`; X.fillRect(0, 0, S, S); }
  return true;
};
</script>
</body></html>
