<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1080" height="1080"></canvas>
<script>
'use strict';
/* Tipografía cinética fluida (estilo Apple): las palabras aparecen una a una de desenfocadas a nítidas,
   la cámara se desliza siguiendo la frase y las líneas viejas se hunden en el fondo. Todo es f(t). */
const S = 1080;
const C = document.getElementById('c'), X = C.getContext('2d');
let CFG = null, SEGS = [], LINES = [], TOK = [], CAMX = [], CAMY = [], CAMZ = [], CAMR = [], frameCache = new Map();

const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const eOut = k => 1 - Math.pow(1 - k, 3);
const eOutQ = k => 1 - Math.pow(1 - k, 5);
const eInOut = k => k < 0.5 ? 16 * Math.pow(k, 5) : 1 - Math.pow(-2 * k + 2, 5) / 2;
const eBack = k => { const c1 = 1.5, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };
const hash = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const segm = new Intl.Segmenter('es', { granularity: 'grapheme' });
const graphemes = s => Array.from(segm.segment(s), g => g.segment);
const mixHex = (a, b, k) => { const p = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)); const A = p(a), B = p(b); return `rgb(${A.map((v, i) => Math.round(lerp(v, B[i], k))).join(',')})`; };

/* emojis iPhone */
const EMO = new Map();
const isEmoTok = w => graphemes(w).length === 1 && EMO.has(w);

/* cámara suave: suma de pasos amortiguados críticamente (siempre continua y sin tirones) */
function damp(keys, t, tau) {
  let v = keys[0].v;
  for (let i = 1; i < keys.length; i++) {
    const k = keys[i]; if (t <= k.t) break;
    const u = (t - k.t) / (k.tau || tau);
    v += (k.v - keys[i - 1].v) * (1 - (1 + u) * Math.exp(-u));
  }
  return v;
}

window.setup = async (cfg) => {
  CFG = cfg;
  for (const f of new Set(cfg.cuts.map(c => c.font))) if (cfg.fontFiles[f]) { const ff = new FontFace(f, `url(${cfg.fontFiles[f]})`); await ff.load(); document.fonts.add(ff); }
  for (const [g, file] of Object.entries(cfg.emoji || {})) { const im = new Image(); im.src = cfg.emojiDir + '/' + file; await im.decode(); EMO.set(g, im); }
  const cs = cfg.cuts, SIZE = cfg.size || 88, ctx = X;
  const font = f => `${SIZE}px "${f}", "Noto Color Emoji"`;
  SEGS = cs.map((c, i) => ({ i, t0: c.t, t1: i + 1 < cs.length ? cs[i + 1].t : Math.min(cfg.dur, c.t + cfg.lastHold), text: c.text, font: c.font, color: (cfg.colors || {})[i], bg: (cfg.bg && cfg.bg[i]) || 'black' }));
  // agrupar tramos en líneas (frases que van juntas en pantalla)
  const maxChars = cfg.lineChars || 24;
  let cur = null;
  SEGS.forEach(s => {
    const len = graphemes(s.text).length;
    if (!cur || cur.chars + len > maxChars || cur.segs.length >= 3) { cur = { segs: [], chars: 0, idx: LINES.length }; LINES.push(cur); }
    cur.segs.push(s); cur.chars += len + 1; s.line = cur;
  });
  // fichas (palabras y emojis) con su posición en la línea y su momento de aparecer
  const GAP = SIZE * 0.32;
  LINES.forEach((L, li) => {
    let x = 0; L.toks = [];
    L.segs.forEach(s => {
      const words = s.text.split(/\s+/).filter(Boolean), toks = [];
      words.forEach(w => { const gs = graphemes(w); const emo = gs.filter(g => EMO.has(g)); const txt = gs.filter(g => !EMO.has(g)).join(''); if (txt) toks.push({ w: txt }); emo.forEach(e => toks.push({ w: e, emo: true })); });
      const dur = s.t1 - s.t0, n = toks.length, step = Math.min(0.16, dur * 0.6 / Math.max(1, n));
      toks.forEach((tk, k) => {
        ctx.font = font(s.font);
        tk.wd = tk.emo ? SIZE * 1.05 : ctx.measureText(tk.w).width;
        tk.x = x; x += tk.wd + GAP; tk.s = s; tk.L = L;
        tk.tr = s.t0 + k * step + (tk.emo ? 0.05 : 0);
        L.toks.push(tk); TOK.push(tk);
      });
      s.x0 = toks.length ? toks[0].x : x; s.x1 = x - GAP;
    });
    L.w = x - GAP;
    L.t0 = L.segs[0].t0; L.t1 = L.segs[L.segs.length - 1].t1;
    // cambio de línea: hundirse en el fondo o bajar la cámara
    L.mode = li === 0 ? 'sink' : ['sink', 'down', 'sink', 'up', 'sink', 'down'][li % 6];
    L.y = 0;
  });
  // posición vertical de cada línea (para las que llegan bajando/subiendo)
  let y = 0; LINES.forEach(L => { if (L.mode === 'down') y += SIZE * 2.2; else if (L.mode === 'up') y -= SIZE * 2.2; L.y = y; });
  // llaves de cámara: x centra lo que ya apareció de la línea; y sigue la línea; zoom para que quepa
  CAMX = [{ t: -1, v: 0 }]; CAMY = [{ t: -1, v: LINES[0].y }]; CAMZ = [{ t: -1, v: 1 }]; CAMR = [{ t: -1, v: 0 }];
  LINES.forEach((L, li) => {
    L.toks.forEach((tk, k) => {
      const right = tk.x + tk.wd, center = right / 2;
      const jump = k === 0 && L.mode === 'sink' && li > 0;
      CAMX.push({ t: tk.tr - (k === 0 ? 0.02 : 0), v: center, tau: jump ? 0.004 : undefined });
      CAMZ.push({ t: tk.tr - (k === 0 ? 0.02 : 0), v: clamp(S * 0.8 / Math.max(1, right), 0.62, 1.05), tau: jump ? 0.004 : undefined });
    });
    CAMY.push({ t: L.t0 - 0.08, v: L.y, tau: 0.13 });
    CAMR.push({ t: L.t0, v: (hash(li + 3) - 0.5) * 0.07, tau: 0.3 });
  });
  // para líneas que se hunden: la cámara salta (sin animar) porque la línea nueva ocupa el mismo lugar
  return SEGS.length;
};

/* ---------- fondo ---------- */
function vframe(t) {
  const n = clamp(Math.round(t * CFG.fps) + 1, 1, CFG.nFrames);
  if (frameCache.has(n)) return frameCache.get(n);
  const im = new Image(); im.src = CFG.framesDir + '/f' + String(n).padStart(4, '0') + '.jpg';
  const p = im.decode().then(() => im);
  frameCache.set(n, p); if (frameCache.size > 12) frameCache.delete(frameCache.keys().next().value);
  return p;
}
function bgMode(t) {
  const first = SEGS[0].t0, last = SEGS[SEGS.length - 1].t1;
  if (t < first || t >= last) return 'full';
  const s = SEGS.find(s => t >= s.t0 && t < s.t1); return s ? s.bg : 'black';
}
async function drawBg(t) {
  const first = SEGS[0].t0, last = SEGS[SEGS.length - 1].t1;
  const intro = t < first, outro = t >= last;
  X.setTransform(1, 0, 0, 1, 0, 0); X.fillStyle = '#000'; X.fillRect(0, 0, S, S);
  // el video entra y sale con fundido suave (sin cortes duros)
  let a = 0;
  for (const s of SEGS) if (s.bg === 'video') { const fin = clamp((t - (s.t0 - 0.15)) / 0.3), fout = 1 - clamp((t - (s.t1 - 0.15)) / 0.3); a = Math.max(a, Math.min(fin, fout)); }
  const full = intro ? 1 : outro ? clamp((t - last + 0.1) / 0.5) : 0;
  if (a <= 0 && full <= 0) return;
  const im = await vframe(t);
  const z = intro ? lerp(1.0, 1.1, t / first) : 1.12 + 0.03 * Math.sin(t * 0.4);
  X.save(); X.translate(S / 2, S / 2); X.scale(z, z); X.translate(-S / 2, -S / 2);
  if (a > 0) { X.globalAlpha = a; X.filter = 'grayscale(0.9) brightness(0.34) contrast(1.15) blur(3px)'; X.drawImage(im, 0, 0, S, S); }
  if (full > 0) {
    // intro: el video se desenfoca y se oscurece justo antes de la primera letra
    const k = intro ? clamp((t - (first - 0.6)) / 0.6) : 0;
    X.globalAlpha = full * (1 - eOut(k));
    X.filter = `saturate(1.1) contrast(1.05) blur(${(eOut(k) * 18).toFixed(1)}px)`;
    X.drawImage(im, 0, 0, S, S);
  }
  X.restore(); X.filter = 'none'; X.globalAlpha = 1;
}

/* ---------- texto ---------- */
function lineState(L, t) {
  // entrada / salida de la línea completa
  const next = LINES[L.idx + 1];
  let a = 1, sc = 1, blur = 0, dy = 0;
  if (L.mode === 'sink' && L.idx > 0) { const k = eOutQ(clamp((t - L.t0 + 0.02) / 0.5)); sc *= lerp(1.18, 1, k); blur += lerp(14, 0, k); }
  const tEnd = next ? next.t0 : L.t1;
  if (t > tEnd - 0.06) {
    const k = clamp((t - (tEnd - 0.06)) / 0.55), e = eOut(k);
    const how = next ? next.mode : 'sink';
    if (how === 'sink') { sc *= lerp(1, 0.72, e); blur += 16 * e; a *= 1 - e; }
    else { blur += 9 * e; a *= 1 - 0.85 * e; }
  }
  return { a, sc, blur, dy };
}
function drawText(t) {
  const camX = damp(CAMX, t, 0.11), camY = damp(CAMY, t, 0.13), camZ = damp(CAMZ, t, 0.16), camR = damp(CAMR, t, 0.3);
  const drift = 1 + 0.025 * Math.sin(t * 0.5);
  const mode = bgMode(t);
  for (const L of LINES) {
    if (t < L.t0 - 0.01) continue;
    const ls = lineState(L, t); if (ls.a <= 0.003) continue;
    // la línea "hundida" se dibuja en su propio lugar respecto a una cámara que ya se fue
    X.save();
    X.setTransform(1, 0, 0, 1, 0, 0);
    X.translate(S / 2, S / 2); X.rotate(camR); X.scale(camZ * drift * ls.sc, camZ * drift * ls.sc);
    // las líneas que se hunden comparten el mismo sitio: su x es relativa a su propio centro de cámara
    const lx = lineCamX(L, t, camX);
    X.translate(-lx, L.y - camY);
    X.textBaseline = 'middle'; X.textAlign = 'left';
    for (const tk of L.toks) {
      const k = (t - tk.tr) / 0.42; if (k < 0) continue;
      const e = eOutQ(clamp(k)), s = tk.s;
      const al = ls.a * clamp(k * 2.2) * (t > s.t1 && L.toks[L.toks.length - 1].s !== s ? 0.55 + 0.45 * (1 - clamp((t - s.t1) / 0.4)) : 1);
      if (al <= 0.003) continue;
      const blur = ls.blur + lerp(12, 0, e);
      X.save();
      X.translate(tk.x + tk.wd / 2, lerp(28, 0, e));
      const sc = tk.emo ? Math.max(0.01, eBack(clamp(k * 1.4))) : lerp(1.1, 1, e);
      X.scale(sc, sc);
      X.globalAlpha = al;
      if (blur > 0.4) X.filter = `blur(${blur.toFixed(1)}px)`;
      if (tk.emo) { const im = EMO.get(tk.w), d = tk.wd * 0.95; X.drawImage(im, -d / 2, -d / 2 - 4, d, d); }
      else {
        X.font = `${CFG.size || 88}px "${s.font}", "Noto Color Emoji"`;
        // palabra nueva en color de acento, luego pasa a blanco
        const acc = s.color ? s.color[0] : (CFG.accent || '#8fd3ff');
        const toWhite = s.color ? 0 : clamp((t - tk.tr - 0.18) / 0.5);
        X.fillStyle = mixHex(acc, '#ffffff', eOut(toWhite));
        if (mode !== 'black') { X.shadowColor = 'rgba(0,0,0,0.6)'; X.shadowBlur = 18; }
        X.fillText(tk.w, -tk.wd / 2, 0);
      }
      X.restore();
    }
    X.restore();
  }
}
/* x de cámara para una línea: la actual usa la cámara; las anteriores se quedan donde estaban al irse */
function lineCamX(L, t, camX) {
  const next = LINES[L.idx + 1];
  if (next && t >= next.t0) return damp(CAMX, next.t0 - 0.001, 0.11);
  return camX;
}
function vignette(a) {
  const g = X.createRadialGradient(S / 2, S / 2, S * 0.3, S / 2, S / 2, S * 0.76);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, `rgba(0,0,0,${a})`);
  X.fillStyle = g; X.fillRect(0, 0, S, S);
}
window.frame = async (t) => {
  await drawBg(t);
  drawText(t);
  X.setTransform(1, 0, 0, 1, 0, 0);
  vignette(0.55);
  const fo = clamp((t - (CFG.dur - 0.9)) / 0.8); if (fo > 0) { X.fillStyle = `rgba(0,0,0,${fo})`; X.fillRect(0, 0, S, S); }
  return true;
};
</script>
</body></html>
